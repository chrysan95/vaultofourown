name: vault-of-our-own

services:
  app:
    build: .
    image: ${DOCKERHUB_USER:-local}/vault-of-our-own:${APP_VERSION:-1.0.0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [vault_net]
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # 01-schema.sql then 02-seed.sql (first start only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vault_net]
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vault_net]
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [vault_net]

  redisinsight:
    image: redis/redisinsight:3.8.0
    profiles: ["tools"]
    environment:
      RI_REDIS_HOST: redis          # pre-adds the "redis" service as a database
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: vault-redis
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [vault_net]

networks:
  vault_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  redisinsight_data:
